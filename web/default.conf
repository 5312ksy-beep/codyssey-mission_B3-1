server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = / {
        try_files /index.html =404;
    }

    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "OK\n";
    }

    location / {
        return 404;
    }
}
